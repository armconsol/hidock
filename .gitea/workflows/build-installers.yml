name: Build Native Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - linux
          - windows

jobs:
  build-macos:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'))
    runs-on: macos-arm64
    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target/aarch64-apple-darwin
          key: ${{ runner.os }}-cargo-macos-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-target-
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build macOS arm64 app
        run: |
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: hinotes-desktop-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7

  build-linux:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'))
    runs-on: linux-amd64
    container:
      image: harbor.tftsr.com/tftsr/tftsr-linux-amd64:rust1.89-node22
    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-linux-amd64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-amd64-
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libusb-1.0-0-dev \
            patchelf \
            pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npx tauri build --target x86_64-unknown-linux-gnu

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: hinotes-desktop-linux-appimage
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          retention-days: 7

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: hinotes-desktop-linux-deb
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          retention-days: 7

      - name: Upload Linux rpm
        uses: actions/upload-artifact@v4
        with:
          name: hinotes-desktop-linux-rpm
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          retention-days: 7

  build-windows:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'))
    runs-on: linux-amd64
    container:
      image: harbor.tftsr.com/tftsr/tftsr-windows-cross:rust1.89-node22
    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (NSIS, cross-compiled)
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          OPENSSL_NO_VENDOR: "0"
          OPENSSL_STATIC: "1"
        run: npx tauri build --target x86_64-pc-windows-gnu

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: hinotes-desktop-windows-nsis
          path: src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
          retention-days: 7

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux, build-windows]
    runs-on: linux-amd64
    container:
      image: alpine:latest
    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          apk add --no-cache git
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        run: |
          # Placeholder for Gitea release creation
          # Gitea doesn't have equivalent to softprops/action-gh-release
          echo "Artifacts built successfully"
          ls -R artifacts/
