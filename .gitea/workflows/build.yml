name: Build Native Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - linux
          - windows

jobs:
  build-macos:
    name: Build macOS Universal Binary
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Install Rust dependencies
        working-directory: src-tauri
        run: cargo fetch

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Universal Binary)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Rename artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd src-tauri/target/universal-apple-darwin/release/bundle

          # Rename DMG
          if [ -d "dmg" ]; then
            mv dmg/*.dmg "HiNotes-Desktop_${VERSION}_universal.dmg" 2>/dev/null || true
          fi

          # Rename app bundle
          if [ -d "macos" ]; then
            cd macos
            tar -czf "../HiNotes-Desktop_${VERSION}_universal_app.tar.gz" *.app
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/*.tar.gz
          if-no-files-found: warn

  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (AppImage, deb, rpm)
        run: npm run tauri build

      - name: Rename artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd src-tauri/target/release/bundle

          # Rename AppImage
          if [ -d "appimage" ]; then
            cd appimage
            for file in *.AppImage; do
              [ -e "$file" ] && mv "$file" "HiNotes-Desktop_${VERSION}_amd64.AppImage"
            done
            cd ..
          fi

          # Rename deb
          if [ -d "deb" ]; then
            cd deb
            for file in *.deb; do
              [ -e "$file" ] && mv "$file" "hinotes-desktop_${VERSION}_amd64.deb"
            done
            cd ..
          fi

          # Rename rpm
          if [ -d "rpm" ]; then
            cd rpm
            for file in *.rpm; do
              [ -e "$file" ] && mv "$file" "hinotes-desktop-${VERSION}.x86_64.rpm"
            done
            cd ..
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'windows' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (MSI)
        run: npm run tauri build
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd src-tauri/target/release/bundle

          # Rename MSI
          if [ -d "msi" ]; then
            cd msi
            for file in *.msi; do
              [ -e "$file" ] && mv "$file" "HiNotes-Desktop_${VERSION}_x64.msi"
            done
            cd ..
          fi

          # Rename NSIS (if exists)
          if [ -d "nsis" ]; then
            cd nsis
            for file in *.exe; do
              [ -e "$file" ] && mv "$file" "HiNotes-Desktop_${VERSION}_x64_setup.exe"
            done
            cd ..
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/macos-universal/*
            artifacts/linux-amd64/*
            artifacts/windows-x64/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
