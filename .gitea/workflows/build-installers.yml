name: Build Native Installers

# On version tags (v*), each platform job uploads its installer directly to a
# Gitea release via the RELEASE_TOKEN secret (curl against the Gitea releases
# API). actions/upload-artifact and actions/download-artifact are NOT used
# anywhere here -- they are unsupported on this self-hosted Gitea instance
# ("GHESNotSupportedError: @actions/artifact v2.0.0+ ... are not currently
# supported on GHES"), confirmed by a failed run. This matches the pattern
# already used in tftsr-devops_investigation's release-beta.yml.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - linux
          - windows

jobs:
  # Gating checks. build-macos/build-linux/build-windows all `needs:` these,
  # so a broken build never gets past a failing fmt/clippy/test check.
  # Gitea Actions has no reliable cross-workflow `workflow_run` gating (see
  # docs.gitea.com/usage/actions/comparison), so — same as
  # tftsr-devops_investigation's needs: autotag pattern — the checks live in
  # this workflow file rather than a separate test.yml that runs independently.
  rust-fmt-check:
    runs-on: linux-amd64
    container:
      image: harbor.tftsr.com/tftsr/tftsr-linux-amd64:rust1.89-node22
    steps:
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD
      - name: Install libusb
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  rust-clippy:
    runs-on: linux-amd64
    container:
      image: harbor.tftsr.com/tftsr/tftsr-linux-amd64:rust1.89-node22
    steps:
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD
      - name: Install libusb
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev
      - run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity

  rust-tests:
    runs-on: linux-amd64
    container:
      image: harbor.tftsr.com/tftsr/tftsr-linux-amd64:rust1.89-node22
    steps:
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD
      - name: Install libusb
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  frontend-typecheck:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    steps:
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          apk add --no-cache git
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies with retry
        run: |
          for i in 1 2 3; do
            if npm ci --prefer-offline --no-audit; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          echo "All retry attempts failed"
          exit 1
      - run: npx tsc --noEmit

  frontend-tests:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    steps:
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          apk add --no-cache git
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies with retry
        run: |
          for i in 1 2 3; do
            if npm ci --prefer-offline --no-audit; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          echo "All retry attempts failed"
          exit 1
      - run: npx vitest run

  # Computes the release tag every build job uploads to. On an actual `v*`
  # tag push, that tag is used as-is. Otherwise (push to main, or
  # workflow_dispatch), the next patch version is auto-derived: X.Y come
  # from package.json's version field, Z is one more than the highest
  # existing `vX.Y.Z` tag in Gitea (0 if none exist yet). This lets
  # "push to main -> tests pass -> installers build -> release bumps"
  # happen with zero manual tagging.
  compute-version:
    needs: [rust-fmt-check, rust-clippy, rust-tests, frontend-typecheck, frontend-tests]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: linux-amd64
    container:
      image: harbor.tftsr.com/tftsr/tftsr-linux-amd64:rust1.89-node22
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD
      - name: Compute next release tag
        id: version
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Using pushed tag as-is: $TAG"
          else
            API="https://gogs.tftsr.com/api/v1/repos/$GITHUB_REPOSITORY"
            BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            EXISTING=$(curl -sf --retry 3 --retry-delay 2 --retry-connrefused "$API/tags?limit=50" \
              -H "Authorization: token $RELEASE_TOKEN" \
              | jq -r --arg prefix "v$BASE." '.[] | select(.name | startswith($prefix)) | .name')
            MAXPATCH=-1
            for t in $EXISTING; do
              patch="${t#v$BASE.}"
              if [[ "$patch" =~ ^[0-9]+$ ]] && [ "$patch" -gt "$MAXPATCH" ]; then
                MAXPATCH="$patch"
              fi
            done
            NEXT=$((MAXPATCH + 1))
            TAG="v$BASE.$NEXT"
            echo "No tag pushed; computed next version from package.json ($BASE) and existing tags: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: [rust-fmt-check, rust-clippy, rust-tests, frontend-typecheck, frontend-tests, compute-version]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'))
    runs-on: macos-arm64
    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target/aarch64-apple-darwin
          key: ${{ runner.os }}-cargo-macos-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-target-
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build macOS arm64 app
        run: |
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin

      - name: Upload to Gitea release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          set -eu
          API="https://gogs.tftsr.com/api/v1/repos/$GITHUB_REPOSITORY"

          BODY=$(awk '
            /^## \[/ { n++; if (n == 2) exit; next }
            n == 1 { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="_No changelog entry found in CHANGELOG.md._"
          fi

          RELEASE_ID=$(curl -sf --retry 3 --retry-delay 2 --retry-connrefused "$API/releases/tags/$TAG" \
            -H "Authorization: token $RELEASE_TOKEN" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(jq -n --arg tag "$TAG" --arg name "HiNotes Desktop $TAG" --arg body "$BODY" --arg sha "$GITHUB_SHA" \
              '{tag_name: $tag, target_commitish: $sha, name: $name, body: $body, draft: false, prerelease: ($tag | test("-"))}' \
              | curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X POST "$API/releases" \
                  -H "Authorization: token $RELEASE_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @- | jq -r '.id')
          else
            jq -n --arg body "$BODY" '{body: $body}' \
              | curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X PATCH "$API/releases/$RELEASE_ID" \
                  -H "Authorization: token $RELEASE_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @- > /dev/null
          fi
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: Failed to create or locate release for $TAG"
            exit 1
          fi

          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No macOS DMG found to upload"
            exit 1
          fi
          NAME="macos-arm64-$(basename "$DMG")"
          EXISTING_ID=$(curl -sf --retry 3 --retry-delay 2 --retry-connrefused "$API/releases/$RELEASE_ID" \
            -H "Authorization: token $RELEASE_TOKEN" \
            | jq -r --arg name "$NAME" '.assets[]? | select(.name == $name) | .id')
          if [ -n "$EXISTING_ID" ]; then
            curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X DELETE "$API/releases/$RELEASE_ID/assets/$EXISTING_ID" \
              -H "Authorization: token $RELEASE_TOKEN"
          fi
          curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X POST "$API/releases/$RELEASE_ID/assets" \
            -H "Authorization: token $RELEASE_TOKEN" \
            -F "attachment=@$DMG;filename=$NAME"
          echo "✓ Uploaded $NAME"

      - name: Purge empty release on upload failure
        if: failure()
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          set -eu
          API="https://gogs.tftsr.com/api/v1/repos/$GITHUB_REPOSITORY"
          RELEASE_ID=$(curl -sf "$API/releases/tags/$TAG" \
            -H "Authorization: token $RELEASE_TOKEN" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "No release exists for $TAG, nothing to purge."
            exit 0
          fi
          ASSET_COUNT=$(curl -sf "$API/releases/$RELEASE_ID" \
            -H "Authorization: token $RELEASE_TOKEN" | jq -r '.assets | length')
          if [ "$ASSET_COUNT" = "0" ]; then
            echo "Release $TAG has no assets from any platform -- purging it and its tag so the next run can retry $TAG instead of skipping to the next patch version."
            curl -sf -X DELETE "$API/releases/$RELEASE_ID" -H "Authorization: token $RELEASE_TOKEN" || true
            curl -sf -X DELETE "$API/tags/$TAG" -H "Authorization: token $RELEASE_TOKEN" || true
          else
            echo "Release $TAG already has $ASSET_COUNT asset(s) from other platform(s) -- leaving it in place. Only this platform's installer is missing; investigate this job's logs and either fix and re-dispatch or manually upload the missing asset."
          fi

  build-linux:
    needs: [rust-fmt-check, rust-clippy, rust-tests, frontend-typecheck, frontend-tests, compute-version]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'))
    runs-on: linux-amd64
    container:
      image: harbor.tftsr.com/tftsr/tftsr-linux-amd64:rust1.89-node22
    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-linux-amd64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-amd64-
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libusb-1.0-0-dev \
            patchelf \
            pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npx tauri build --target x86_64-unknown-linux-gnu

      - name: Upload to Gitea release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          set -eu
          API="https://gogs.tftsr.com/api/v1/repos/$GITHUB_REPOSITORY"

          BODY=$(awk '
            /^## \[/ { n++; if (n == 2) exit; next }
            n == 1 { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="_No changelog entry found in CHANGELOG.md._"
          fi

          RELEASE_ID=$(curl -sf --retry 3 --retry-delay 2 --retry-connrefused "$API/releases/tags/$TAG" \
            -H "Authorization: token $RELEASE_TOKEN" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(jq -n --arg tag "$TAG" --arg name "HiNotes Desktop $TAG" --arg body "$BODY" --arg sha "$GITHUB_SHA" \
              '{tag_name: $tag, target_commitish: $sha, name: $name, body: $body, draft: false, prerelease: ($tag | test("-"))}' \
              | curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X POST "$API/releases" \
                  -H "Authorization: token $RELEASE_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @- | jq -r '.id')
          else
            jq -n --arg body "$BODY" '{body: $body}' \
              | curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X PATCH "$API/releases/$RELEASE_ID" \
                  -H "Authorization: token $RELEASE_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @- > /dev/null
          fi
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: Failed to create or locate release for $TAG"
            exit 1
          fi

          ARTIFACTS=$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -type f \
            \( -name "*.deb" -o -name "*.rpm" \))
          if [ -z "$ARTIFACTS" ]; then
            echo "ERROR: No Linux artifacts found to upload"
            exit 1
          fi
          printf '%s\n' "$ARTIFACTS" | while IFS= read -r f; do
            NAME="linux-amd64-$(basename "$f")"
            EXISTING_ID=$(curl -sf --retry 3 --retry-delay 2 --retry-connrefused "$API/releases/$RELEASE_ID" \
              -H "Authorization: token $RELEASE_TOKEN" \
              | jq -r --arg name "$NAME" '.assets[]? | select(.name == $name) | .id')
            if [ -n "$EXISTING_ID" ]; then
              curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X DELETE "$API/releases/$RELEASE_ID/assets/$EXISTING_ID" \
                -H "Authorization: token $RELEASE_TOKEN"
            fi
            curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X POST "$API/releases/$RELEASE_ID/assets" \
              -H "Authorization: token $RELEASE_TOKEN" \
              -F "attachment=@$f;filename=$NAME"
            echo "✓ Uploaded $NAME"
          done

      - name: Purge empty release on upload failure
        if: failure()
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          set -eu
          API="https://gogs.tftsr.com/api/v1/repos/$GITHUB_REPOSITORY"
          RELEASE_ID=$(curl -sf "$API/releases/tags/$TAG" \
            -H "Authorization: token $RELEASE_TOKEN" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "No release exists for $TAG, nothing to purge."
            exit 0
          fi
          ASSET_COUNT=$(curl -sf "$API/releases/$RELEASE_ID" \
            -H "Authorization: token $RELEASE_TOKEN" | jq -r '.assets | length')
          if [ "$ASSET_COUNT" = "0" ]; then
            echo "Release $TAG has no assets from any platform -- purging it and its tag so the next run can retry $TAG instead of skipping to the next patch version."
            curl -sf -X DELETE "$API/releases/$RELEASE_ID" -H "Authorization: token $RELEASE_TOKEN" || true
            curl -sf -X DELETE "$API/tags/$TAG" -H "Authorization: token $RELEASE_TOKEN" || true
          else
            echo "Release $TAG already has $ASSET_COUNT asset(s) from other platform(s) -- leaving it in place. Only this platform's installer is missing; investigate this job's logs and either fix and re-dispatch or manually upload the missing asset."
          fi

  build-windows:
    needs: [rust-fmt-check, rust-clippy, rust-tests, frontend-typecheck, frontend-tests, compute-version]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'))
    runs-on: linux-amd64
    container:
      image: harbor.tftsr.com/tftsr/tftsr-windows-cross:rust1.89-node22
    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (NSIS, cross-compiled)
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          OPENSSL_NO_VENDOR: "0"
          OPENSSL_STATIC: "1"
        run: npx tauri build --target x86_64-pc-windows-gnu

      - name: Upload to Gitea release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          set -eu
          API="https://gogs.tftsr.com/api/v1/repos/$GITHUB_REPOSITORY"

          BODY=$(awk '
            /^## \[/ { n++; if (n == 2) exit; next }
            n == 1 { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="_No changelog entry found in CHANGELOG.md._"
          fi

          RELEASE_ID=$(curl -sf --retry 3 --retry-delay 2 --retry-connrefused "$API/releases/tags/$TAG" \
            -H "Authorization: token $RELEASE_TOKEN" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(jq -n --arg tag "$TAG" --arg name "HiNotes Desktop $TAG" --arg body "$BODY" --arg sha "$GITHUB_SHA" \
              '{tag_name: $tag, target_commitish: $sha, name: $name, body: $body, draft: false, prerelease: ($tag | test("-"))}' \
              | curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X POST "$API/releases" \
                  -H "Authorization: token $RELEASE_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @- | jq -r '.id')
          else
            jq -n --arg body "$BODY" '{body: $body}' \
              | curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X PATCH "$API/releases/$RELEASE_ID" \
                  -H "Authorization: token $RELEASE_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @- > /dev/null
          fi
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: Failed to create or locate release for $TAG"
            exit 1
          fi

          EXE=$(find src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis -type f -name "*.exe" | head -1)
          if [ -z "$EXE" ]; then
            echo "ERROR: No Windows installer found to upload"
            exit 1
          fi
          NAME="windows-x64-$(basename "$EXE")"
          EXISTING_ID=$(curl -sf --retry 3 --retry-delay 2 --retry-connrefused "$API/releases/$RELEASE_ID" \
            -H "Authorization: token $RELEASE_TOKEN" \
            | jq -r --arg name "$NAME" '.assets[]? | select(.name == $name) | .id')
          if [ -n "$EXISTING_ID" ]; then
            curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X DELETE "$API/releases/$RELEASE_ID/assets/$EXISTING_ID" \
              -H "Authorization: token $RELEASE_TOKEN"
          fi
          curl -sf --retry 3 --retry-delay 2 --retry-connrefused -X POST "$API/releases/$RELEASE_ID/assets" \
            -H "Authorization: token $RELEASE_TOKEN" \
            -F "attachment=@$EXE;filename=$NAME"
          echo "✓ Uploaded $NAME"

      - name: Purge empty release on upload failure
        if: failure()
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          set -eu
          API="https://gogs.tftsr.com/api/v1/repos/$GITHUB_REPOSITORY"
          RELEASE_ID=$(curl -sf "$API/releases/tags/$TAG" \
            -H "Authorization: token $RELEASE_TOKEN" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "No release exists for $TAG, nothing to purge."
            exit 0
          fi
          ASSET_COUNT=$(curl -sf "$API/releases/$RELEASE_ID" \
            -H "Authorization: token $RELEASE_TOKEN" | jq -r '.assets | length')
          if [ "$ASSET_COUNT" = "0" ]; then
            echo "Release $TAG has no assets from any platform -- purging it and its tag so the next run can retry $TAG instead of skipping to the next patch version."
            curl -sf -X DELETE "$API/releases/$RELEASE_ID" -H "Authorization: token $RELEASE_TOKEN" || true
            curl -sf -X DELETE "$API/tags/$TAG" -H "Authorization: token $RELEASE_TOKEN" || true
          else
            echo "Release $TAG already has $ASSET_COUNT asset(s) from other platform(s) -- leaving it in place. Only this platform's installer is missing; investigate this job's logs and either fix and re-dispatch or manually upload the missing asset."
          fi
