name: Pull Request Review

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: linux-amd64
    container:
      image: harbor.tftsr.com/tftsr/tftsr-linux-amd64:rust1.89-node22

    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Install libusb
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev

      - name: Install dependencies
        run: npm ci

      - name: Check for TODO/FIXME in production code
        run: |
          echo "Checking for placeholders in production code..."
          PLACEHOLDERS=$(grep -r "TODO\|FIXME\|placeholder\|stub" src-tauri/src/ --include="*.rs" | grep -v "test\|//" | wc -l)
          echo "Found $PLACEHOLDERS placeholders in production code"
          if [ "$PLACEHOLDERS" -gt 0 ]; then
            echo "❌ Found TODO/FIXME/placeholder in production code:"
            grep -r "TODO\|FIXME\|placeholder\|stub" src-tauri/src/ --include="*.rs" | grep -v "test\|//"
            exit 1
          fi
          echo "✅ No placeholders found in production code"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity

  backend-tests:
    name: Backend Tests (Rust)
    runs-on: linux-amd64
    container:
      image: harbor.tftsr.com/tftsr/tftsr-linux-amd64:rust1.89-node22

    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Install libusb
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture

      - name: Check backend compilation
        run: cargo build --manifest-path src-tauri/Cargo.toml --lib

  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine

    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          apk add --no-cache git
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

  integration-tests:
    name: Integration Tests
    runs-on: linux-amd64
    needs: [backend-tests, frontend-tests]
    container:
      image: harbor.tftsr.com/tftsr/tftsr-linux-amd64:rust1.89-node22

    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Install libusb
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npx tauri build --debug

      - name: Test binary exists
        run: |
          if [ -f "src-tauri/target/debug/hinotes-desktop" ]; then
            echo "✅ Binary built successfully"
          else
            echo "❌ Binary not found"
            exit 1
          fi

  security-audit:
    name: Security Audit
    runs-on: linux-amd64
    container:
      image: harbor.tftsr.com/tftsr/tftsr-linux-amd64:rust1.89-node22

    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run npm audit
        run: npm audit --production || echo "⚠️  npm vulnerabilities found"

      - name: Run cargo audit
        run: cargo audit --file src-tauri/Cargo.lock || echo "⚠️  Rust vulnerabilities found"

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, backend-tests, frontend-tests, integration-tests, security-audit]
    if: always()
    container:
      image: alpine:latest

    steps:
      - name: Generate summary
        run: |
          echo "## PR Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Jobs Status" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [ "${{ needs.code-quality.result }}" = "success" ] && \
             [ "${{ needs.backend-tests.result }}" = "success" ] && \
             [ "${{ needs.frontend-tests.result }}" = "success" ] && \
             [ "${{ needs.integration-tests.result }}" = "success" ]; then
            echo "### ✅ All checks passed! PR is ready for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some checks failed. Please review the logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
