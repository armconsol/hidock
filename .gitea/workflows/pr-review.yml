name: Pull Request Review

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    container:
      image: rustlang/rust:nightly

    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Install system dependencies and Node.js
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install dependencies
        run: npm ci

      - name: Check for TODO/FIXME in production code
        run: |
          echo "Checking for placeholders in production code..."
          PLACEHOLDERS=$(grep -r "TODO\|FIXME\|placeholder\|stub" src-tauri/src/ --include="*.rs" | grep -v "test\|//" | wc -l)
          echo "Found $PLACEHOLDERS placeholders in production code"
          if [ "$PLACEHOLDERS" -gt 0 ]; then
            echo "❌ Found TODO/FIXME/placeholder in production code:"
            grep -r "TODO\|FIXME\|placeholder\|stub" src-tauri/src/ --include="*.rs" | grep -v "test\|//"
            exit 1
          fi
          echo "✅ No placeholders found in production code"

      - name: Check frontend formatting
        run: npm run lint || echo "⚠️  Linting warnings found"

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity

  backend-tests:
    name: Backend Tests (Rust)
    runs-on: ubuntu-latest
    container:
      image: rustlang/rust:nightly

    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --lib -- --nocapture

      - name: Check backend compilation
        working-directory: src-tauri
        run: cargo build --lib

  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest
    container:
      image: node:20

    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          apt-get update && apt-get install -y --no-install-recommends git
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    container:
      image: rustlang/rust:nightly

    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            curl

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run tauri build -- --debug

      - name: Test binary exists
        run: |
          if [ -f "src-tauri/target/debug/hinotes-desktop" ] || [ -f "src-tauri/target/debug/hinotes-desktop.exe" ]; then
            echo "✅ Binary built successfully"
          else
            echo "❌ Binary not found"
            exit 1
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    container:
      image: rustlang/rust:nightly

    steps:
      - name: Checkout code
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GITEA_TOKEN}@gogs.tftsr.com/sarman/hinotes.git"
          if [ -n "${GITHUB_SHA:-}" ] && git fetch --depth=1 origin "$GITHUB_SHA"; then
            echo "Fetched commit SHA: $GITHUB_SHA"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            echo "Fetched ref name: $GITHUB_REF_NAME"
          else
            git fetch --depth=1 origin main
            echo "Fetched fallback ref: main"
          fi
          git checkout FETCH_HEAD

      - name: Install system dependencies and Node.js
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run npm audit
        run: npm audit --production || echo "⚠️  npm vulnerabilities found"

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit || echo "⚠️  Rust vulnerabilities found"

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, backend-tests, frontend-tests, integration-tests, security-audit]
    if: always()
    container:
      image: alpine:latest

    steps:
      - name: Generate summary
        run: |
          echo "## PR Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Jobs Status" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [ "${{ needs.code-quality.result }}" = "success" ] && \
             [ "${{ needs.backend-tests.result }}" = "success" ] && \
             [ "${{ needs.frontend-tests.result }}" = "success" ] && \
             [ "${{ needs.integration-tests.result }}" = "success" ]; then
            echo "### ✅ All checks passed! PR is ready for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some checks failed. Please review the logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
