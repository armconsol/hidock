name: Build Native Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - linux
          - windows

jobs:
  build-macos:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'))
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cross-rs/aarch64-apple-darwin:edge
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build universal macOS app
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: hinotes-desktop-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7

  build-linux:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'))
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ubuntu:22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl \
            ca-certificates \
            git \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run tauri build

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: hinotes-desktop-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: hinotes-desktop-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7

      - name: Upload Linux rpm
        uses: actions/upload-artifact@v4
        with:
          name: hinotes-desktop-linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 7

  build-windows:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'))
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cross-rs/x86_64-pc-windows-gnu:edge
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu

      - name: Install dependencies
        run: npm ci

      - name: Build Windows MSI
        run: npm run tauri build -- --target x86_64-pc-windows-gnu

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: hinotes-desktop-windows-msi
          path: src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
          retention-days: 7

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        run: |
          # Placeholder for Gitea release creation
          # Gitea doesn't have equivalent to softprops/action-gh-release
          echo "Artifacts built successfully"
          ls -R artifacts/
