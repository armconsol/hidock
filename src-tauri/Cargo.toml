[package]
name = "hinotes-desktop"
version = "1.0.0-alpha"
description = "Cross-platform desktop app for HiNotes with offline-first architecture"
authors = ["Shaun Arman"]
edition = "2021"

[lib]
name = "hinotes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
dotenv = "0.15"
tiny_http = "0.12.0"
open = "5.4.1"
dirs = "5.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
url = "2.5"
form_urlencoded = "1.2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
keyring = { version = "2.3", features = ["platform-macos", "platform-windows", "platform-linux"] }

# USB device communication
rusb = "0.9"

# File system monitoring for mass storage fallback
notify = "6.0"

# Audio file processing
hound = "3.5"
symphonia = { version = "0.5", features = ["all"] }

# Language detection
whatlang = "0.16"

[dev-dependencies]
tempfile = "3.10"

